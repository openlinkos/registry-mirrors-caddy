name: smoke

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 每天一次：上游换了 CDN 地址时，白名单需要及时补充
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: http
      PUBLIC_SCHEME: http
      BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - name: Validate
        run: |
          docker compose config -q
          for mode in http tls; do
            docker run --rm -v "$PWD/caddy:/etc/caddy:ro" -e MODE=$mode -e DOMAIN=example.com \
              caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Start
        run: docker compose up -d
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail 200
          tail -n 50 logs/access.log || true
      - name: Stop
        if: always()
        run: docker compose down
